name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-Check
        run: npm run check
      - name: Test-Suite (Stub-Harnesses, kein Netz nötig)
        run: npm test
